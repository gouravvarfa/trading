<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification | TraderinMe</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #010204;
            --accent: #3b82f6;
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(10, 12, 16, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* Stops the whole page from moving */
            padding: 20px;
        }

        /* --- STABLE BACKGROUND GRID --- */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            /* Static Tilt - No crazy movement here */
            transform: perspective(1000px) rotateX(60deg) translateY(-100px);
            z-index: -1;
        }

        /* --- THE CARD (CENTERED & STEADY) --- */
        .login-card {
            position: relative;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: clamp(30px, 8vw, 50px);
            border-radius: 28px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            z-index: 10;
            /* Simple entrance only, no constant shaking */
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Border Glow - Fixed to the Card */
        .glow-border {
            position: absolute;
            inset: 0;
            border-radius: 28px;
            padding: 1.5px;
            background: conic-gradient(from 0deg, transparent, var(--accent), transparent, transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            animation: borderRotate 4s linear infinite;
            pointer-events: none;
        }

        @keyframes borderRotate { 100% { transform: rotate(360deg); } }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 35px;
            text-align: center;
        }

        /* --- FORM ELEMENTS --- */
        .input-group { margin-bottom: 15px; }

        input {
            width: 100%;
            padding: 18px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            color: white;
            border-radius: 14px;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            background: rgba(0,0,0,0.7);
        }

        .recovery-link {
            display: block;
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: #475569;
            text-decoration: none;
            margin: 5px 0 20px;
            text-transform: uppercase;
        }

        .recovery-link:hover { color: var(--accent); }

        button {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .flash {
            margin-top: 20px;
            color: #ff4d4d;
            font-size: 0.7rem;
            font-family: 'JetBrains Mono';
            padding: 12px;
            border-left: 2px solid #ff4d4d;
            background: rgba(255, 77, 77, 0.05);
        }

    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="login-card">
        <div class="glow-border"></div>
        
        <div class="logo">TRADERINME <span style="color:var(--accent)">PRO</span></div>
        <div class="subtitle">Secure Identity Portal</div>

        <form method="POST">
            <div class="input-group">
                <input type="text" name="username" placeholder="OPERATOR_ID" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="SECURITY_PHRASE" required>
            </div>
            
            

            <button type="submit">Initialize Access</button>
        </form>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="flash">[ERROR]: {{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <a href="/" style="display:block; margin-top:25px; color:#475569; text-decoration:none; font-size:0.65rem; text-align:center; font-family: 'JetBrains Mono';">TERMINATE CONNECTION</a>
    </div>

</body>
</html>
